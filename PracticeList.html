<html>
<head>
    <title>HTML List</title>
</head>
<body>

    <h1>HTML List</h1>
    <h2>Unordered List (ul)</h2>

    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>


    <h2>Unordered List with Style</h2>
	<ul style= Type=  "square";>
        <li>Apple</li>
        <li>Mango</li>
        <li>Orange</li>
    </ul>
    <h2>Ordered List (ol)</h2>

    <ol>
        <li>Wake up</li>
        <li>Study</li>
        <li>Go to University</li>
    </ol>

</body>
</html>
