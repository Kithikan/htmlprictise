<!DOCTYPE html>
<html>
<head>
    <title>HTML Table Demo</title>
    <style>
        /* This adds visible borders to your table */
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 8px;
        }
    </style>
</head>
<body>

    <h2>My First HTML Table</h2>

    <table>
        <!-- Table Header Row -->
        <tr>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Age</th>
        </tr>
        <!-- Data Row 1 -->
        <tr>
            <td>Kithi</td>
            <td>rohit</td>
            <td>17</td>
        </tr>
        <!-- Data Row 2 -->
        <tr>
            <td>Sulaxan</td>
            <td>Viratkh0li</td>
            <td>17</td>
        </tr>
    </table>

</body>
</html>
